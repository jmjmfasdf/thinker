# the setting in this yaml will override default_thinker (for actor-critic run)
# env
name: "Sokoban-v0" # name of the environment
# env override setting
require_prob: true # whether to use prob to train model instead of sampled action
parallel: true # whether to use a parallel ray actor for training the model
discounting: 0.97 # discount rate of the raw MDP
reward_clip: -1.0 # reward clipping; if positve, the reward is clipped within the absolute value of this values
# training setting
train_actor: true # whether to train actor
total_steps: 100000000 # total number of real steps to train 1e8
actor_learning_rate: 0.0003 # actor learning rate
actor_batch_size: 16 # actor batch size
actor_unroll_len: 201 # unroll length used to update actor
actor_use_rms: false # whether to use rms (default: adam) as optimizer
actor_grad_norm_clipping: 0.5 # gradient clipping norm; non-positive for no clipping
actor_amp_max_consecutive_skips: 8 # fail after this many consecutive AMP overflows
actor_amp_init_scale: 256.0 # main actor GradScaler initial scale; atomic schemas 6-11 require exactly 32
actor_adam_eps: 0.00000001 # eps for Adam optimizer
return_norm_type: -1 # return norm type; -1 for no normalization, 0 for value normalization, 1 for advantage normalization, 2 for standard adv normalization
v_trace_lamb: 1. # lambda used in v-trace
# cost setting
im_cost: 1 # cost for imaginary rewards, modified
im_cost_anneal: true # whether to anneal the imaginary cost to 0
cur_cost: 0. # cost for curiosity rewards - unused
cur_cost_anneal: true # whether to anneal the curiosity cost to 0
think_cost: 0.002 # cost applied to the Dynamic Thinker planning-reward channel
think_cost_anneal: false # computation cost is part of the final objective
dynamic_voc_mode: 'off' # off, shadow (critic only), or control (VoC-directed soft gate)
voc_loss_cost: 1.0 # VoC-Q loss multiplier; schemas 8-9 use half-squared TD and schemas 10-11 use beta-1 SmoothL1
voc_gate_temperature: 1.0 # temperature of the stochastic STOP/CONTINUE gate
voc_train_epsilon: 0.02 # uniform gate exploration mixed in during training
voc_eval_stochastic: true # sample the learned gate at evaluation instead of argmax
voc_dueling_q: true # policy-centered V/d critics; schemas 9-11 also restore the raw-head mean
voc_expected_gate_loss: true # exact discrete expected-Q gate objective
voc_ema_gate_target: true # frozen EMA Q head drives the stochastic gate
voc_gate_target_tau: 0.1 # successful-online-Q-step Polyak update rate
voc_dedicated_gate: true # detached scalar CONTINUE/STOP policy head
voc_soft_q_bce_gate: true # confidence-weighted soft-Q BCE policy improvement
voc_gate_q_temperature: 0.05 # return-Q temperature for the soft gate teacher
voc_gate_confidence_weighted: true # make equal-Q directed gate gradient exactly zero
voc_gate_adam_beta1: 0.9 # first-moment decay for the isolated Adam gate optimizer
voc_gate_param_align: false # directly align gate log-odds with the frozen soft-Q teacher
voc_gate_param_align_coef: 1.0 # fixed unit weight for gate-parameter alignment
voc_gate_exact_projection: false # deterministically project the gate onto the post-EMA soft-Q head
voc_gate_epsilon_greedy_execution: false # execute the projected scalar gate by sign with uniform epsilon exploration
voc_gate_execution_epsilon: 0.02 # atomic-schema actual sign-policy epsilon; legacy schemas retain voc_train_epsilon behavior
voc_actor_policy_version_barrier: false # schemas 6-11 strict homogeneous actor-policy epoch barrier
voc_model_input_seal_schema_version: 0 # schemas 7-11 model-input seal; legacy/schema-6 resolve exact 0
voc_actor_policy_bundle_schema_version: 1 # atomic actor-policy publication bundle schema
voc_actor_policy_barrier_timeout_s: 120.0 # monotonic fail-fast barrier deadline
voc_actor_policy_ray_max_restarts: 0 # atomic-schema critical Ray actors never restart
voc_actor_policy_ray_max_task_retries: 0 # atomic-schema actor tasks never retry
voc_gate_learning_rate: 0.0003 # isolated gate-policy optimizer learning rate
voc_gate_grad_norm_clipping: 1.0 # isolated gate-policy gradient clipping norm
voc_parent_checkpoint: '' # exact shadow ckp_actor.tar promoted into a fresh control run
baseline_cost: 0.5 # cost for computing baseline
entropy_r_cost: 0. # entropy cost added to reward
entropy_cost: 0.001 # entropy cost for real actions
im_entropy_cost: 0.0005 # entropy cost for imaginary actions, modified
autotune: false # autotune the entropy_cost and im_entropy_cost
tar_entropy_scale: 0.4 # target policy entropy; 1 for uniform policy so it should be less than 1
tar_im_entropy_scale: 0.4 # target imaginary policy entropy; 1 for uniform policy so it should be less than 1
reg_cost: 0.001 # regularization cost
action_prior_weight: 1.0 # per-real-policy-row KL toward the human action prior (active only with icopro_data_path)
action_prior_ema: 0.05 # EMA update rate for the online real-policy distribution
# actor setting
# - general
see_real_state: True # whether to see root real state
see_tree_rep: true # whether to see tree representation
see_h: true # whether to see model's hidden state
see_x: True # whether to see the model's predicted state
legacy: false # whether to use legacy version
sep_actor_critic: false # whether to separate actor and critic
drc: false # whether to use the drc baseline
mcts: false # whether to use the mcts baseline
# -tree rep processing
tree_rep_rnn: false # whether to use rnn in processing tree representation
dynamic_search_hidden_dim: 100 # hidden/output width of the masked Dynamic tree-token GRU
se_lstm_table: true # whether to use lstm to enablde tables
# -real state processing
x_rnn: false # whether to use rnn in processing x, model's predicted state
h_rnn: false # whether to use rnn in processing h, model's recurrent state
real_state_rnn: false # whether to use rnn in processing real state
real_state_ch: -1 # limit the number of channel of real state that agent sees; -1 for seeing all channels
enc_1d_shallow: false # whether to use shallow encoding (1d input only)
enc_1d_norm: true # enable layer normalization in 1d encoder
enc_1d_block: 2 # number of res block for 1d encoder
enc_1d_hs: 256 # hidden size of 1d encoder
# -rnn setting
tran_t: 1 # internal transition step for rnn
tran_mem_n: 40 # memory slot size for the attention module in lstm-attn
tran_layer_n: 3 # number of layers of lstm-attn
tran_head_n: 8 # number of head for each attention layer
tran_lstm_no_attn: false # whether to disable the attention module in lstm-attn
tran_attn_b: 5 # initial bias for attending to the current step
tran_dim: 128 # hidden dimension of lstm-attn
tran_reset_mode: 0 # 0: reset when done; 1: reset when real done; 2: never reset
# -critic setting
critic_zero_init: true # whether to zero initialize the critic outputs
critic_enc_type: 0 # reward / value encoding type for the critic; 0 for no encoding, 1 for scalar encoding, 2 for unbiased vector encoding, 3 for biased vector encoding
critic_enc_f_type: 0 # scalar encoding function for reward / value encoding; 0 for MuZero-like encoding, 1 for Dreamer-like encoding
# -output setting
sep_im_head: true # whether to use seperate head for computing imaginary logit
last_layer_n: 0 # number of hidden layer after concat different branch
actor_ordinal: false # whether to use ordinal representation in actor's policy
tanh_action: true # whether to use tanh activation for action (continuous only)
# -specific setting for continuous policy
actor_min_std: 0.003 # minimum std of Gaussian policy
actor_max_std: 10 # maximum std of Gaussian policy
# PPO-related
ppo_k: 1 # number of SGD iteration per epoch; set to higher than 1 to enable ppo
ppo_n: 64 # size of circular buffer
ppo_kl_coef: 0. # kl coef; i.e. loss cost for KL divergence between target policy and current policy
ppo_kl_targ: 0.04 # target kl divergence
ppo_early_stop: false # no more iteration if kl div exceed target
ppo_syn: false # synchronized buffer
ppo_clip: 0.3 # clip for is ratio
ppo_v_trace: true # forcing to use v-trace
# checkpoint
xpid: '' # name of the run, automatically set if not given
ckp: false # whether to load checkpoint; if set to true, will load checkpoint from savedir/xpid
preload_actor: '' # path for the folder that consists ckp_actor.tar, which is used to initialize  actor
savedir: '../logs/__project__' # base log directory
checkpoint_interval: 250000 # frequency in real steps to save checkpoints (set to 0 to disable)
buffer_save_size: 1 # number of episodes to save when saving buffer data
use_wandb: True # whether to use wandb; need to have global variable WANDB_USER set to wandb user
wandb_ckp_freq: 0 # frequency in real steps to upload all files in the run
policy_vis_freq: -1 # frequency in real steps to visualize the run
policy_vis_length: 20 # length of the video visualization
# misc
profile: false # whether to output all the time statistics of the run
parallel_actor: true # whether to use a parallel ray actor for training the actor
float16: true # whether to use mixed precision
# dynamic behavioral imitation (disabled when icopro_data_path is empty)
icopro_data_path: '' # behavioral_data_block root
icopro_subjects: '1' # comma-separated participant IDs
icopro_game_id: 0 # behavioral archive game entity; action count comes from the live environment
icopro_train_sessions: '1,2,3' # explicit training-session filter
icopro_holdout_sessions: '4'
icopro_batch_size: 32
batch_length: 4 # number of scored real decisions after one unscored burn-in
icopro_margin: 1.0 # DQfD margin size
icopro_margin_coef: 1.0
icopro_action_diff_coef: 1.0 # normalized cross-entropy coefficient
icopro_pvp_coef: 0.0
icopro_coef: 1.0 # overall behavioral-cloning coefficient
icopro_supervised_freq: 1 # one imitation batch per this many actor optimizer calls
icopro_device: cpu # frozen ModelNet/planner device
# ray resources
auto_res: True # whether to auto allocate gpu
ray_mem: -1 # default initialized ray memory unit: GB
ray_gpu: -1 # number of initial gpu (set to -1 for auto detect)
ray_cpu: -1 # number of initial cpu (set to -1 for auto detect)
self_play_n: 1 # number of self-play ray actors (will be set automatically if auto_res is enabled)
env_n: 16  # number of parallel environment for each self-play ray actors
gpu_self_play: 0.25 # gpu for each self-play ray actor (will be set automatically if auto_res is enabled)
gpu_learn_actor: 0.25 # gpu for the actor-learning ray actor (will be set automatically if auto_res is enabled)
gpu_learn: 0.5 # gpu for the model-learning ray actor (will be set automatically if auto_res is enabled)
